<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gurugram University — Department Brochures</title>
  <meta name="description" content="Browse Gurugram University departmental brochures — modern, responsive, and print-ready." />

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa7b2;
      --accent:#6ee7b7; /* teal-ish */
      --accent-2:#60a5fa; /* blue */
      --glass: rgba(255,255,255,0.04);
      --radius:14px;
      --maxwidth:1100px;
      --shadow: 0 6px 30px rgba(2,6,23,0.6);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100%;
      background: linear-gradient(180deg,#071021 0%, #071827 40%, #071827 100%);
      color: #e6eef3;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:32px 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
    }

    .wrap{
      width:100%;
      max-width:var(--maxwidth);
      margin:0 auto;
    }

    header{
      display:flex;
      align-items:center;
      gap:18px;
      margin-bottom:22px;
    }
    .logo{
      width:64px;
      height:64px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 6px 24px rgba(59,130,246,0.18);
      flex-shrink:0;
    }
    .logo svg{filter:drop-shadow(0 4px 18px rgba(0,0,0,0.35));}
    h1{
      font-size:20px;
      margin:0;
      letter-spacing:0.2px;
    }
    p.lead{
      margin:4px 0 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .controls{
      margin-top:18px;
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
    }

    .search{
      display:flex;
      gap:10px;
      align-items:center;
      background:var(--glass);
      padding:8px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.03);
      width:100%;
      max-width:540px;
    }
    .search input{
      background:transparent;border:0;color:inherit;outline:none;font-size:15px;width:100%;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      margin-top:20px;
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      padding:18px;
      min-height:120px;
      box-shadow:var(--shadow);
      display:flex;
      gap:14px;
      align-items:center;
      transition:transform .24s ease, box-shadow .24s ease;
      border:1px solid rgba(255,255,255,0.03);
    }
    .card:hover{ transform:translateY(-8px); box-shadow:0 18px 46px rgba(2,6,23,0.7); }

    .dept-icon{
      width:58px;height:58px;border-radius:12px;background:linear-gradient(135deg,#0ea5a7 0%, #3b82f6 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;
      box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    }
    .dept-icon svg{width:34px;height:34px;opacity:0.98}

    .card .meta{
      flex:1;
      min-width:0;
    }
    .card h3{margin:0;font-size:16px}
    .card p{margin:6px 0 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .card button{
      background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;color:var(--accent-2);cursor:pointer;font-weight:600;
      transition:transform .12s ease,background .12s ease;
    }
    .card button:active{transform:translateY(1px)}
    .card button.primary{
      background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#042027;border:0;
      box-shadow: 0 8px 22px rgba(96,165,250,0.12);
    }

    /* responsive */
    @media (max-width:980px){
      .grid{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:560px){
      header{flex-direction:column;align-items:flex-start;gap:8px}
      .grid{grid-template-columns:1fr}
      .controls{flex-direction:column;gap:10px;align-items:stretch}
      .search{width:100%}
    }

    /* Modal / brochure viewer */
    .modal{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
      background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.9));
      padding:24px;
    }
    .modal.show{display:flex}
    .viewer{
      width:100%;
      max-width:980px;
      height:82vh;
      background:linear-gradient(180deg,#081226, #071827);
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 40px 120px rgba(2,6,23,0.8);
      border:1px solid rgba(255,255,255,0.04);
      display:flex;
      flex-direction:column;
    }
    .viewer .vhead{
      display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.03);
    }
    .vhead .title{display:flex;gap:12px;align-items:center}
    .vhead h2{margin:0;font-size:16px}
    .vhead p{margin:0;color:var(--muted);font-size:13px}
    .vtools{display:flex;gap:10px;align-items:center}
    .btn{
      background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:600;
    }
    .btn.ghost{background:transparent}
    .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#042027;border:0}

    .viewer iframe{
      width:100%;
      height:100%;
      border:0;
      background:#fff;
      flex:1;
    }

    .empty{
      padding:28px;text-align:center;color:var(--muted)
    }

    footer{
      margin-top:26px;color:var(--muted);font-size:13px;text-align:center;
    }

    /* subtle entrance animation for cards */
    .card{opacity:0;transform:translateY(12px);animation:pop .45s ease forwards}
    .card:nth-child(1){animation-delay:.06s}
    .card:nth-child(2){animation-delay:.12s}
    .card:nth-child(3){animation-delay:.18s}
    .card:nth-child(4){animation-delay:.24s}
    .card:nth-child(5){animation-delay:.30s}
    .card:nth-child(6){animation-delay:.36s}
    @keyframes pop{
      to{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div class="logo" aria-hidden="true">
        <!-- simple GU monogram -->
        <svg viewBox="0 0 48 48" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="44" height="44" rx="10" fill="white" opacity="0.08"/>
          <path d="M13 34L13 15L23 15C25.2091 15 27 16.7909 27 19V29C27 31.2091 25.2091 33 23 33H13Z" fill="white" opacity="0.9"/>
          <path d="M29 34L29 15L35 15L35 34L29 34Z" fill="white" opacity="0.9"/>
        </svg>
      </div>

      <div>
        <h1>Gurugram University — Department Brochures</h1>
        <p class="lead">Click a department to open its brochure. Use Print → Save as PDF to export brochures.</p>
      </div>
    </header>

    <div class="controls" role="search">
      <div class="search" aria-label="Search departments">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></circle>
        </svg>
        <input type="search" id="search" placeholder="Search departments, e.g. engineering, education..." />
      </div>

      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn" id="btnAll">Show All</button>
        <button class="btn primary" id="btnContact">Contact TPO</button>
      </div>
    </div>

    <section class="grid" id="grid" aria-live="polite" style="margin-bottom:12px;">
      <!-- department cards injected by JS -->
    </section>

    <footer>
      <small>Designed for Gurugram University • Responsive • Print-friendly brochures</small>
    </footer>
  </div>

  <!-- Modal viewer -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="viewer" role="document">
      <div class="vhead">
        <div class="title">
          <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="44" height="44" rx="10" fill="#0ea5a7" opacity="0.12"/>
            <path d="M13 34L13 15L23 15C25.2091 15 27 16.7909 27 19V29C27 31.2091 25.2091 33 23 33H13Z" fill="#60a5fa" opacity="0.9"/>
            <path d="M29 34L29 15L35 15L35 34L29 34Z" fill="#6ee7b7" opacity="0.9"/>
          </svg>
          <div>
            <h2 id="vTitle">Department</h2>
            <p id="vSubtitle">Brochure preview</p>
          </div>
        </div>

        <div class="vtools">
          <button class="btn" id="downloadBtn" title="Download brochure as .html">Download</button>
          <button class="btn primary" id="printBtn" title="Print or Save as PDF">Print / Save PDF</button>
          <button class="btn" id="closeBtn" aria-label="Close viewer">Close</button>
        </div>
      </div>

      <!-- iframe will show generated brochure -->
      <iframe id="viewerFrame" srcdoc="<p class='empty'>No brochure loaded</p>"></iframe>
    </div>
  </div>

  <script>
    // Departments data
    const departments = [
      {
        id: 'eng',
        name: 'Department of Engineering & Technology',
        short: 'Undergraduate and postgraduate programs in core engineering disciplines and applied technologies.',
        head: 'Dr. A. Sharma',
        contact: 'engg@gurugramuniv.edu.in',
        phone: '+91-124-XXXXXXX',
        highlights: [
          'B.Tech: CSE, ECE, ME, Civil',
          'M.Tech specializations & Research labs',
          'Industry internships & placements'
        ]
      },
      {
        id: 'edu',
        name: 'Department of Education',
        short: 'Programs in teacher education, pedagogy research, and curriculum studies.',
        head: 'Dr. Shweta K.',
        contact: 'education@gurugramuniv.edu.in',
        phone: '+91-124-XXXXXXX',
        highlights: [
          'B.Ed & M.Ed programs',
          'Practical teaching labs & partnerships with schools',
          'Workshops in pedagogy & assessment'
        ]
      },
      {
        id: 'mgmt',
        name: 'Department of Management Studies',
        short: 'Management, business administration, entrepreneurship and corporate partnerships.',
        head: 'Prof. R. Gupta',
        contact: 'management@gurugramuniv.edu.in',
        phone: '+91-124-XXXXXXX',
        highlights: [
          'MBA (Full-time) & Executive MBA',
          'Industry mentorship & live projects',
          'Career development cell & placement support'
        ]
      },
      {
        id: 'ph',
        name: 'Department of Public Health',
        short: 'Public health programs focusing on community health, epidemiology and policy.',
        head: 'Dr. N. Verma',
        contact: 'publichealth@gurugramuniv.edu.in',
        phone: '+91-124-XXXXXXX',
        highlights: [
          'MPH & short courses in epidemiology',
          'Community outreach & health camps',
          'Research in public health policy'
        ]
      },
      {
        id: 'arts',
        name: 'Department of Arts & Humanities',
        short: 'Literature, languages, history, cultural studies and critical theory.',
        head: 'Dr. Meera S.',
        contact: 'arts@gurugramuniv.edu.in',
        phone: '+91-124-XXXXXXX',
        highlights: [
          'BA & MA programs in Humanities',
          'Cultural festivals & lecture series',
          'Cross-disciplinary research'
        ]
      },
      {
        id: 'sc',
        name: 'Department of Sciences',
        short: 'Natural sciences: Physics, Chemistry, Mathematics, and interdisciplinary research.',
        head: 'Dr. P. Khatri',
        contact: 'science@gurugramuniv.edu.in',
        phone: '+91-124-XXXXXXX',
        highlights: [
          'BSc & MSc programs',
          'Research labs and international collaborations',
          'Student-led projects & science club'
        ]
      }
    ];

    // Utility: create a card element for department
    function createDeptCard(dep){
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-id', dep.id);

      // icon
      const icon = document.createElement('div');
      icon.className = 'dept-icon';
      icon.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3L20 7v6c0 5-4 9-8 9s-8-4-8-9V7l8-4z" fill="white" opacity="0.12"></path><path d="M7 10h10M7 14h6" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      `;

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `<h3>${dep.name}</h3><p>${dep.short}</p>`;

      const btn = document.createElement('div');
      btn.innerHTML = `<button class="primary openBtn" data-id="${dep.id}">Open Brochure</button>`;

      card.appendChild(icon);
      card.appendChild(meta);
      card.appendChild(btn);

      return card;
    }

    // Populate grid
    const grid = document.getElementById('grid');
    function populate(list){
      grid.innerHTML = '';
      if(list.length === 0){
        grid.innerHTML = `<div style="grid-column:1/-1" class="empty">No departments found</div>`;
        return;
      }
      for(const d of list){
        grid.appendChild(createDeptCard(d));
      }
    }

    populate(departments);

    // search filter
    const search = document.getElementById('search');
    search.addEventListener('input', (e)=>{
      const q = e.target.value.trim().toLowerCase();
      const filtered = departments.filter(d =>
        d.name.toLowerCase().includes(q) ||
        d.short.toLowerCase().includes(q) ||
        (d.highlights||[]).join(' ').toLowerCase().includes(q)
      );
      populate(filtered);
    });

    document.getElementById('btnAll').addEventListener('click', ()=>{
      search.value = '';
      populate(departments);
    });

    document.getElementById('btnContact').addEventListener('click', ()=>{
      // Example contact for TPO
      const subject = encodeURIComponent('Placement Drive Enquiry — Gurugram University');
      const body = encodeURIComponent('Hello TPO Team,\n\nI am the Student Placement Coordinator at Gurugram University (Sector-51). I would like to enquire about the hiring/placement process and the information needed to conduct a placement drive at our university for final-year students.\n\nKindly share the steps, timelines, and any required documents. Thank you.\n\nRegards,\n[Your name]\nStudent Placement Coordinator');
      window.location.href = `mailto:tpo@gurugramuniv.edu.in?subject=${subject}&body=${body}`;
    });

    // Modal / viewer handling
    const modal = document.getElementById('modal');
    const viewerFrame = document.getElementById('viewerFrame');
    const vTitle = document.getElementById('vTitle');
    const vSubtitle = document.getElementById('vSubtitle');
    const closeBtn = document.getElementById('closeBtn');
    const printBtn = document.getElementById('printBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Build a printable brochure HTML for a department
    function buildBrochureHTML(dep){
      // A minimal, print-friendly brochure layout styled inline so iframe print works
      const highlightsHTML = (dep.highlights || []).map(h => `<li>${escapeHtml(h)}</li>`).join('');
      const now = new Date().toLocaleDateString();
      const html = `
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(dep.name)} — Brochure</title>
<style>
  :root{--accent:#0ea5a7;--accent2:#60a5fa;--text:#071827}
  body{font-family: Inter, -apple-system, system-ui, "Segoe UI", Roboto, Arial; margin:0; color: #08202b;}
  .page{padding:28px;max-width:790px;margin:18px auto;}
  header{display:flex;gap:18px;align-items:center;margin-bottom:12px}
  .logo{width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
  h1{margin:0;font-size:20px}
  p.lead{margin:8px 0;color:#234e52}
  section{background:#f8fbfc;border-radius:12px;padding:16px;margin-top:12px;box-shadow:0 6px 20px rgba(12,38,48,0.06)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .muted{color:#5f6d6f;font-size:13px}
  ul{margin:6px 0 0 18px}
  footer{margin-top:18px;color:#4b5b5f;font-size:13px}
  @media print{
    body{background:white}
    .page{box-shadow:none;margin:0;max-width:100%}
    .no-print{display:none}
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="logo">GU</div>
      <div>
        <h1>${escapeHtml(dep.name)}</h1>
        <p class="muted">${escapeHtml(dep.short)}</p>
        <p class="muted">Updated: ${now}</p>
      </div>
    </header>

    <section>
      <h3>Overview</h3>
      <p class="muted">The ${escapeHtml(dep.name)} offers degree programmes, practical training, and research opportunities. The department focuses on academic excellence and student employability.</p>

      <div class="grid" style="margin-top:12px">
        <div>
          <h4>Programs & Highlights</h4>
          <ul>
            ${highlightsHTML}
          </ul>
        </div>
        <div>
          <h4>Department Info</h4>
          <p class="muted"><strong>Head:</strong> ${escapeHtml(dep.head)}</p>
          <p class="muted"><strong>Email:</strong> ${escapeHtml(dep.contact)}</p>
          <p class="muted"><strong>Phone:</strong> ${escapeHtml(dep.phone)}</p>
        </div>
      </div>

      <div style="margin-top:12px">
        <h4>Placement & Industry</h4>
        <p class="muted">We maintain strong ties with industry partners to facilitate internships and placement drives. For placement collaborations or queries, contact the Training & Placement Office.</p>
      </div>
    </section>

    <footer>
      <small>Gurugram University • Sector-51, Gurugram • www.gurugramuniv.edu.in</small>
      <div class="no-print" style="margin-top:10px">
        <button onclick="window.print()" style="padding:10px 16px;border-radius:8px;border:0;background:linear-gradient(90deg,var(--accent),var(--accent2));color:white;cursor:pointer">Print / Save as PDF</button>
      </div>
    </footer>
  </div>
</body>
</html>
      `;
      return html;
    }

    // escape helper
    function escapeHtml(str){
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // open brochure modal for department id
    function openBrochure(id){
      const dep = departments.find(d => d.id === id);
      if(!dep) return alert('Department not found');
      vTitle.textContent = dep.name;
      vSubtitle.textContent = dep.short;
      const doc = buildBrochureHTML(dep);
      // set iframe content via srcdoc for print fidelity
      viewerFrame.srcdoc = doc;

      // set modal visible
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');

      // prepare download content for download button
      downloadBtn.dataset.filename = `${dep.id}-brochure.html`;
      downloadBtn.dataset.content = doc;
    }

    // delegate click on open buttons
    document.addEventListener('click', (e)=>{
      const openBtn = e.target.closest('.openBtn');
      if(openBtn){
        const id = openBtn.dataset.id;
        openBrochure(id);
      }
    });

    // close modal
    closeBtn.addEventListener('click', ()=>closeModal());
    modal.addEventListener('click', (e)=>{
      if(e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && modal.classList.contains('show')) closeModal();
    });

    function closeModal(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      // blank the iframe to free memory
      viewerFrame.srcdoc = `<p class="empty">No brochure loaded</p>`;
    }

    // print — instruct iframe to print (open print dialog)
    printBtn.addEventListener('click', ()=>{
      try{
        viewerFrame.contentWindow.focus();
        viewerFrame.contentWindow.print();
      }catch(err){
        // fallback: open in new tab then print
        const content = viewerFrame.srcdoc || '';
        const w = window.open();
        w.document.open();
        w.document.write(content);
        w.document.close();
        w.focus();
        w.print();
      }
    });

    // download as .html file (so user can save and later open / print)
    downloadBtn.addEventListener('click', ()=>{
      const filename = downloadBtn.dataset.filename || 'brochure.html';
      const content = downloadBtn.dataset.content || viewerFrame.srcdoc || '';
      const blob = new Blob([content], {type:'text/html;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // keyboard shortcut: press number keys 1..6 to open departments quickly
    document.addEventListener('keydown', (e)=>{
      if(e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
      const mapping = { '1':0,'2':1,'3':2,'4':3,'5':4,'6':5 };
      if(mapping[e.key] !== undefined){
        const idx = mapping[e.key];
        if(departments[idx]) openBrochure(departments[idx].id);
      }
    });

    // Accessibility: focus trap when modal open
    (function(){
      let lastFocused = null;
      const focusableSelector = 'a,button,input,textarea,select,[tabindex]:not([tabindex="-1"])';
      document.addEventListener('focusin', (e)=>{
        if(modal.classList.contains('show')) return;
      });
      // Record last focused element before opening modal
      const observer = new MutationObserver(()=> {
        if(modal.classList.contains('show')){
          lastFocused = document.activeElement;
          // focus close button
          closeBtn.focus();
        } else {
          if(lastFocused) lastFocused.focus();
        }
      });
      observer.observe(modal, {attributes:true, attributeFilter:['class']});
    })();

    // Small enhancement: allow department list to be keyboard accessible
    grid.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' ') {
        const btn = e.target.closest('.openBtn');
        if(btn) btn.click();
      }
    });

    // For progressive enhancement: if JS disabled, provide a simple fallback message
    // (Not executed when JS runs)
  </script>
</body>
</html>
