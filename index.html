<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Mahak 💖</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffe6eb, #fff3f3, #ffe6f7);
    color: #333;
    overflow: hidden;
  }

  .dialog {
    background: white;
    padding: 30px 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
    animation: fadeIn 0.8s ease;
    max-width: 300px;
    width: 90%;
  }

  h2 {
    font-size: 1.3em;
    margin-bottom: 20px;
    color: #e63946;
  }

  button {
    margin: 10px;
    padding: 10px 20px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-size: 1em;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .yes {
    background: linear-gradient(45deg, #ff9a9e, #fad0c4);
    color: white;
  }

  .no {
    background: linear-gradient(45deg, #fbc2eb, #a6c1ee);
    color: white;
  }

  button:hover {
    transform: scale(1.05);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message {
    font-size: 1.3em;
    color: #e63946;
    animation: fadeIn 0.6s ease;
  }

  @media (max-width: 600px) {
    h2 { font-size: 1.1em; }
    button { font-size: 0.9em; padding: 8px 16px; }
  }
</style>
</head>
<body>

<div class="dialog" id="dialogBox">
  <h2 id="question">Did you forgive me, Mahak? 💖</h2>
  <button class="yes" onclick="forgive()">Yes</button>
  <button class="no" onclick="notYet()">No</button>
</div>

<script>
  const questions = [
    "Are you sure? 🥺",
    "Please na 😢",
    "Just one more chance? 💕",
    "You really won’t forgive me? 😭",
    "Come on Mahak, please 😞",
    "I promise I’ll never be late again 🙏",
    "Still no? 😔",
    "I’m not giving up 😅",
    "Please na Mahak 💖",
    "You have the sweetest heart 💕",
    "Forgive me now? 😇",
    "Last time asking... maybe 😅",
    "Okay last-last time 🙈",
    "Now? 🥹",
    "Pleaseeeeeeeeeeeee 🥺💞"
  ];

  let i = 0;

  function forgive() {
    document.getElementById("dialogBox").innerHTML = `
      <div class="message">Thank you so much, Mahak! 💖<br><br>You just made Keshav the happiest person today 😊</div>
    `;
  }

  function notYet() {
    const question = document.getElementById("question");
    question.textContent = questions[i % questions.length];
    i++;
  }
</script>

</body>
</html>
