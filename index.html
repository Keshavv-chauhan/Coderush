<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Mahak 💖</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe5ec, #ffeaf6, #fdf2ff);
    font-family: "Poppins", sans-serif;
    overflow: hidden;
  }

  .container {
    text-align: center;
    background: white;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    max-width: 320px;
    width: 90%;
    animation: fadeIn 0.6s ease;
  }

  h2 {
    color: #e63946;
    font-size: 1.4em;
    margin-bottom: 15px;
  }

  p {
    color: #555;
    margin-bottom: 25px;
    font-size: 0.95em;
  }

  .buttons {
    display: flex;
    justify-content: space-around;
    gap: 15px;
  }

  button {
    flex: 1;
    border: none;
    border-radius: 25px;
    padding: 10px 0;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 1em;
  }

  .yes {
    background: linear-gradient(45deg, #ff9a9e, #fad0c4);
    color: #fff;
  }

  .no {
    background: linear-gradient(45deg, #a1c4fd, #c2e9fb);
    color: #fff;
  }

  button:hover {
    transform: scale(1.07);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .thankyou {
    color: #e63946;
    font-size: 1.2em;
    animation: fadeIn 0.6s ease;
  }

  @media (max-width: 600px) {
    .container { padding: 30px 20px; }
    h2 { font-size: 1.2em; }
    p { font-size: 0.9em; }
  }
</style>
</head>
<body>

<div class="container" id="dialogBox">
  <h2 id="question">Did you forgive me, Mahak? 💖</h2>
  <p id="message">I know I was late... I truly didn’t mean to be. Please forgive me?</p>
  <div class="buttons">
    <button class="yes" onclick="forgive()">Yes</button>
    <button class="no" onclick="nextQuestion()">No</button>
  </div>
</div>

<script>
  const dialogs = [
    {
      q: "Are you sure you can’t forgive me? 🥺",
      m: "I know I messed up. But I really didn’t want to hurt you."
    },
    {
      q: "Please na… 😢",
      m: "Give me one more chance. I’ll be on time, I promise."
    },
    {
      q: "Just one more chance? 💕",
      m: "I’ll make it up to you — coffee, treat, anything!"
    },
    {
      q: "You really won’t forgive me? 😞",
      m: "It hurts to know I made you wait. Please…"
    },
    {
      q: "I’m begging now 😭",
      m: "Mahak, please forgive me? I’ll try so much harder."
    },
    {
      q: "Still no? 😔",
      m: "Okay fine... but I’m still not giving up 😅"
    },
    {
      q: "Maybe now? 🥹",
      m: "You have the kindest heart. I know you’ll forgive me soon 💖"
    },
    {
      q: "Forgive me this time? 🙈",
      m: "I’ll make it up with something sweet next time!"
    },
    {
      q: "Last time asking... maybe 😅",
      m: "Or maybe not... because I’ll keep asking till you smile 😊"
    },
    {
      q: "Pleaseeeee Mahak 🥺",
      m: "Forgive me na? I can’t end this without your yes 💞"
    }
  ];

  let index = 0;

  function forgive() {
    const box = document.getElementById("dialogBox");
    box.innerHTML = `
      <div class="thankyou">Thank you so much, Mahak! 💖<br><br>
      You just made Keshav the happiest person today 😊</div>
    `;
  }

  function nextQuestion() {
    const q = document.getElementById("question");
    const m = document.getElementById("message");
    index = (index + 1) % dialogs.length;
    q.textContent = dialogs[index].q;
    m.textContent = dialogs[index].m;
  }
</script>

</body>
</html>
